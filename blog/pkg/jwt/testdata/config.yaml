# CI/CD 单元测试专用配置，不含任何真实密钥
app:
  name: blog-project-test
  version: test
  mode: test
  host: 127.0.0.1
  port: 9527

jwt:
  secret: unit-test-secret-do-not-use-in-prod
  access_expire_minutes: 30
  refresh_expire_hours: 168
  remember_me_hours: 720

database:
  mysql:
    host: 127.0.0.1
    port: 3306
    username: test
    password: test
    database: test
    max_idle_conns: 5
    max_open_conns: 10
  redis:
    host: 127.0.0.1
    port: 6379
    password: ""
    db: 0
    pool_size: 10

log:
  level: error
  filename: logs/test.log
  max_size: 10
  max_backups: 3
  max_age: 7
  compress: false
