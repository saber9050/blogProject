name: CI

# 触发时机：任何 PR 和主干分支的推送都会跑；也支持手动触发
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# 同一分支的新提交自动取消旧任务，节省 Actions 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: blog/go.mod
  NODE_VERSION: '18'

jobs:
  # ========== 后端：静态检查 + 单测 + 编译 ==========
  backend:
    name: 后端 Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: blog/go.sum

      - name: 静态检查 go vet
        run: go vet ./...

      - name: 代码格式检查 gofmt
        # 注意：本仓库历史文件为 CRLF 换行，而 gofmt 输出 LF。
        # 这里先剥离 CR 再比对，只报真正的格式问题，不因换行符误报。
        run: |
          unformatted=""
          while IFS= read -r f; do
            if ! diff -q <(gofmt "$f") <(sed 's/\r$//' "$f") >/dev/null; then
              unformatted="$unformatted $f"
            fi
          done < <(find . -name '*.go' -type f)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            for f in $unformatted; do echo "  $f"; done
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: 单元测试（含竞态检测与覆盖率）
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 输出覆盖率摘要
        run: go tool cover -func=coverage.out | tail -5

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: blog/coverage.out
          retention-days: 7

      - name: 编译校验
        run: go build -ldflags="-s -w" -o /tmp/blog-server ./cmd/server

  # ========== 前端：类型检查 + 单测 + 构建 ==========
  frontend:
    name: 前端 Vue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vue/package-lock.json

      - name: 安装依赖（npm ci 保证与 lock 文件一致）
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: vue/dist
          retention-days: 7

  # ========== 镜像与编排：确保 Dockerfile / compose 可用 ==========
  docker:
    name: 镜像可构建性校验
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 文件语法
        # 编排文件对密钥类变量用了 ${VAR:?} 必填语法（不给弱口令兜底），
        # CI 环境没有 .env，这里补一份一次性假值，仅用于语法校验。
        env:
          MYSQL_PASSWORD: ci-placeholder
          MINIO_SECRET_KEY: ci-placeholder
        run: docker compose -f docker-compose.yml config --quiet

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像（不推送，仅验证 Dockerfile）
        uses: docker/build-push-action@v5
        with:
          context: ./blog
          push: false
          tags: blog-backend:ci
          cache-from: type=gha,scope=blog-backend
          cache-to: type=gha,scope=blog-backend,mode=max

      - name: 构建前端镜像（不推送，仅验证 Dockerfile）
        uses: docker/build-push-action@v5
        with:
          context: ./vue
          push: false
          tags: blog-frontend:ci
          cache-from: type=gha,scope=blog-frontend
          cache-to: type=gha,scope=blog-frontend,mode=max
