name: CD

# ============================================================
# 持续部署：CI 全绿后自动构建镜像并部署到阿里云 ECS
#
# 设计要点：
#   - 通过 workflow_run 监听 CI，只有 CI 成功才部署（门禁）
#   - 镜像 tag 用 git commit sha，可追溯、可回滚
#   - 构建在 GitHub Runner 上做，2C4G 的 ECS 只负责 pull，不现场编译
# ============================================================
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

# 部署任务不允许并发取消，避免部署到一半被中断
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ---------- 解析出本次要部署的 commit ----------
  resolve:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: 计算镜像 tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "本次部署 commit: ${SHA::7}"

  # ---------- 构建并推送镜像到阿里云 ACR ----------
  build:
    name: 构建镜像
    needs: resolve
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./blog
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/blog-backend:${{ env.TAG }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/blog-backend:latest
          cache-from: type=gha,scope=blog-backend
          cache-to: type=gha,scope=blog-backend,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./vue
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/blog-frontend:${{ env.TAG }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/blog-frontend:latest
          cache-from: type=gha,scope=blog-frontend
          cache-to: type=gha,scope=blog-frontend,mode=max

  # ---------- SSH 到 ECS 执行部署 ----------
  deploy:
    name: 部署到 ECS
    needs: [resolve, build]
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: 同步编排文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: docker-compose.prod.yml,scripts/deploy.sh
          target: ${{ secrets.ECS_DEPLOY_PATH }}
          strip_components: 0

      - name: 执行部署脚本
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD,IMAGE_TAG
          script: |
            set -e
            cd ${{ secrets.ECS_DEPLOY_PATH }}
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh "$IMAGE_TAG"

      - name: 部署结果通知
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "部署成功，镜像 tag: ${{ needs.resolve.outputs.tag }}"
          else
            echo "部署失败，服务器应已自动回滚到上一版本"
          fi
