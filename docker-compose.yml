# ============================================================
# 🚀 服务器上 Docker Hub 拉不动？配置镜像加速：
#
# 1️⃣ 设置 registry mirror（一行搞定）：
#      sudo mkdir -p /etc/docker
#      sudo tee /etc/docker/daemon.json <<-'EOF'
#      {
#        "registry-mirrors": [
#          "https://docker.m.daocloud.io",
#          "https://dockerproxy.cn",
#          "https://docker.nju.edu.cn"
#        ]
#      }
#      EOF
#      sudo systemctl daemon-reload
#      sudo systemctl restart docker
#
# 2️⃣ 配置后拉取镜像（比默认快 10 倍）：
#      docker compose pull
#      docker compose up -d --build
# ============================================================

services:

  # ===================== PostgreSQL（主库 + pgvector） =====================
  # 用途：业务表与向量表同库，让「删旧 chunk + 写新 chunk」能放进同一个事务。
  # 镜像选 pgvector 官方版，而不是官方 postgres 再手工装扩展——
  # 迁移工具和 CI 都用同一个镜像，避免「本地过了线上挂」。
  postgres:
    image: pgvector/pgvector:pg17
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      # 不设兜底值：宁可启动失败并给出明确提示，也不要静默使用弱口令/泄露的口令
      POSTGRES_PASSWORD: "${PG_PASSWORD:?请先 cp .env.example .env 并设置 PG_PASSWORD}"
      POSTGRES_USER: "${PG_USER:-postgres}"
      POSTGRES_DB: "${PG_DATABASE:-blog-project}"
      TZ: Asia/Shanghai
      # 显式 UTF8：默认 locale 在不同宿主机上可能不同，编码不一致会直接毁掉中文数据
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-blog-project}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== Redis =====================
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== MinIO =====================
  minio:
    image: minio/minio:RELEASE.2022-01-04T07-41-07Z
    container_name: blog-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?请先 cp .env.example .env 并设置 MINIO_SECRET_KEY}"
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    networks:
      - blog-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== Backend =====================
  blog-backend:
    build:
      context: ./blog
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    ports:
      - "9527:9527"
    # 配置外挂：真实 config.yaml 已被 .dockerignore 排除（密钥不进镜像），
    # 运行时挂载宿主机文件，改配置改完重启容器即可，无需重新构建镜像
    volumes:
      - ./blog/configs/config.yaml:/app/configs/config.yaml:ro
    environment:
      # 覆盖数据库连接地址（内部 Docker 网络）
      # 这些变量在 pkg/config/loader.go 里是显式 os.Getenv 读取的，确保生效
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: "${PG_USER:-postgres}"
      PG_PASSWORD: "${PG_PASSWORD}"
      PG_DATABASE: "${PG_DATABASE:-blog-project}"
      CORE_COACH_DATABASE_REDIS_HOST: redis
      CORE_COACH_DATABASE_REDIS_PORT: 6379
      # MinIO 连接地址（内部 Docker 网络）
      CORE_COACH_MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - blog-network

  # ===================== Frontend =====================
  blog-frontend:
    build:
      context: ./vue
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - blog-backend
    networks:
      - blog-network

volumes:
  pg_data:
  redis_data:
  minio_data:
  # ⚠️ 已停用的 MySQL 数据卷，**故意保留声明**：
  # 1) 迁移后一个月内是唯一的回滚位，出问题能退回旧库；
  # 2) 留在 compose 文件里，是为了防止有人执行 `docker compose down -v` 时
  #    （-v 只删文件里声明过的卷）把历史数据一起清掉。
  # 确认不再需要回滚后，再手工 `docker volume rm` 并删掉这一行。
  mysql_data:

networks:
  blog-network:
    driver: bridge
