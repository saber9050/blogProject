# ============================================================
# 🚀 服务器上 Docker Hub 拉不动？配置镜像加速：
#
# 1️⃣ 设置 registry mirror（一行搞定）：
#      sudo mkdir -p /etc/docker
#      sudo tee /etc/docker/daemon.json <<-'EOF'
#      {
#        "registry-mirrors": [
#          "https://docker.m.daocloud.io",
#          "https://dockerproxy.cn",
#          "https://docker.nju.edu.cn"
#        ]
#      }
#      EOF
#      sudo systemctl daemon-reload
#      sudo systemctl restart docker
#
# 2️⃣ 配置后拉取镜像（比默认快 10 倍）：
#      docker compose pull
#      docker compose up -d --build
# ============================================================

services:

  # ===================== MySQL =====================
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      # 不设兜底值：宁可启动失败并给出明确提示，也不要静默使用弱口令/泄露的口令
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:?请先 cp .env.example .env 并设置 MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-blog-project}"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== Redis =====================
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== MinIO =====================
  minio:
    image: minio/minio:RELEASE.2022-01-04T07-41-07Z
    container_name: blog-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?请先 cp .env.example .env 并设置 MINIO_SECRET_KEY}"
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    networks:
      - blog-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== Backend =====================
  blog-backend:
    build:
      context: ./blog
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    ports:
      - "9527:9527"
    # 配置外挂：真实 config.yaml 已被 .dockerignore 排除（密钥不进镜像），
    # 运行时挂载宿主机文件，改配置改完重启容器即可，无需重新构建镜像
    volumes:
      - ./blog/configs/config.yaml:/app/configs/config.yaml:ro
    environment:
      # 覆盖数据库连接地址（内部 Docker 网络）
      CORE_COACH_DATABASE_MYSQL_HOST: mysql
      CORE_COACH_DATABASE_MYSQL_PORT: 3306
      CORE_COACH_DATABASE_REDIS_HOST: redis
      CORE_COACH_DATABASE_REDIS_PORT: 6379
      # MinIO 连接地址（内部 Docker 网络）
      CORE_COACH_MINIO_ENDPOINT: minio:9000
      # 大模型（OpenAI 兼容协议）；api_key 优先由此环境变量注入
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - blog-network

  # ===================== Frontend =====================
  blog-frontend:
    build:
      context: ./vue
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - blog-backend
    networks:
      - blog-network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  blog-network:
    driver: bridge
