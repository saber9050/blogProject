# ============================================================
# blog-frontend Nginx 配置（生产）
#
#   listen 80  : 只做 301 跳转到 HTTPS，另留「容器健康检查端点」
#                与「ACME 挑战目录」（为将来自动续期留口子）
#   listen 443 : 站点主入口。TLS 终结 + SPA 静态 + /api/ 反代后端
#                + /oss/ 反代 MinIO
#
# 证书不打进镜像，由宿主机挂载进容器（见 docker-compose.prod.yml 的
# ./certs:/etc/nginx/certs:ro），避免私钥进入镜像仓库。
# ============================================================

server {
    listen       80;
    server_name  zouxp.xyz www.zouxp.xyz _;

    # 容器健康检查端点：不参与跳转，直接 200。
    # 注意必须用 127.0.0.1 探活而不是 localhost —— 容器内 localhost 会解析到
    # ::1，而 nginx 只监听 IPv4，会造成健康检查假失败。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 证书续期用的 ACME 挑战目录（将来换成 acme.sh / certbot 时直接可用）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 其余全部 301 到 HTTPS，并统一收敛到主域（不带 www）
    location / {
        return 301 https://zouxp.xyz$request_uri;
    }
}

server {
    listen       443 ssl;
    http2        on;
    server_name  zouxp.xyz www.zouxp.xyz;

    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 说明：暂不开启 HSTS。证书是 3 个月有效期的免费证书，一旦续期失败，
    # 开启 HSTS 会让浏览器在有效期内直接拒绝访问且无法手动跳过。
    # 等续期流程稳定后再考虑 add_header Strict-Transport-Security。

    root   /usr/share/nginx/html;
    index  index.html;

    # 压缩
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # SPA 路由：所有前端路由 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端服务
    # 用 ^~ 前缀匹配，保证不会被下面的「静态资源正则」抢走
    location ^~ /api/ {
        client_max_body_size 10m;
        proxy_pass http://blog-backend:9527/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO 对象存储反向代理
    # 目的：让图片与页面同源、同走 HTTPS。
    # 后端拼接图片地址用的是 minio.base_url（.env 的 MINIO_PUBLIC_URL），
    # 上 HTTPS 后若它仍是 http://IP:9000，浏览器会以 mixed content 拦截整页图片。
    # 把它改成 https://zouxp.xyz/oss 后，请求经此处转发到 MinIO。
    location ^~ /oss/ {
        proxy_pass http://blog-minio:9000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 带 hash 的构建产物长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
